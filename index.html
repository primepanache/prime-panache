<style>
:root{--ink:#20261f;--gold:#c59a50;--gold2:#e0bf7b;--paper:#f7f5f0;--card:#fffdf9;--muted:#706c64;--line:#e5ded2;--soft:#f0ece4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#181817;font-family:"DM Sans",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}

.search{height:44px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:1;max-width:620px;margin:auto}.search input{border:0;outline:0;flex:1;padding:12px 16px}.search button{height:100%;border:0;background:var(--ink);color:#fff;padding:0 20px}.nav-actions{display:flex;gap:8px}.circle{width:43px;height:43px;border:1px solid var(--line);border-radius:50%;background:#fff;position:relative}.circle i{position:absolute;right:-2px;top:-3px;background:var(--gold2);font-style:normal;font-size:9px;min-width:17px;height:17px;border-radius:50%;display:grid;place-items:center}
.hero{max-width:1236px;margin:28px auto 0;min-height:430px;border-radius:30px;padding:52px;background:radial-gradient(circle at 84% 18%,#d7b16b45,transparent 25%),linear-gradient(115deg,#20261f,#354233 55%,#1b211b);color:#fff;position:relative;overflow:hidden}.hero h1{font:600 clamp(45px,6vw,72px)/.98 "Playfair Display",serif;margin:15px 0}.hero h1 em{color:#ead7ad;font-weight:500}.hero p{max-width:600px;line-height:1.7;color:#e4e2db}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--gold2)}.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:700;margin:8px 6px 0 0}.gold{background:#e3c27f;color:var(--ink)}.outline{background:#ffffff12;color:#fff;border:1px solid #fff4}
.trust{max-width:1236px;margin:18px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.trust div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.trust b,.trust small{display:block}.trust b{font-size:13px}.trust small{font-size:11px;color:var(--muted);margin-top:4px}
.section{max-width:1236px;margin:55px auto}.section h2{font:600 37px "Playfair Display",serif;margin:7px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end}.sectionhead p{color:var(--muted)}.sectionhead select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px}.chips button.active{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-5px);box-shadow:0 25px 70px #1b181012}.cardimg{height:270px;position:relative;background:#efede7}.cardimg img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;left:12px;top:12px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:700}.wish{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:#fffdf0e8;font-size:18px}.cardbody{padding:16px}.cat{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#a1783b;font-weight:700}.cardbody h3{font-size:16px;line-height:1.35;margin:8px 0}.rating{font-size:12px;color:#9b712e}.rating span{color:var(--muted)}.price{font-size:22px;font-weight:700;margin-top:12px}.price del{font-size:12px;color:#999;margin-left:5px}.off{font-size:11px;color:#48724e;margin-left:6px}.actions{display:flex;gap:7px;margin-top:13px}.actions button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700}.actions .dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.story{max-width:1236px;margin:65px auto;padding:48px 54px;border-radius:28px;background:#eee5d5}.story p{max-width:700px;line-height:1.7;color:var(--muted)}
footer{background:var(--ink);color:#eee8dc;padding:45px max(22px,calc((100% - 1236px)/2));display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px;margin-top:65px}footer p,footer a{color:#b9bdb4;font-size:13px;line-height:1.7}footer b{color:#d7b16b;font-size:11px;letter-spacing:.14em}footer a{display:block;margin:8px 0}
.page{max-width:1236px;margin:30px auto}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:18px}.product-page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:45px;background:#fffdf9;border:1px solid var(--line);border-radius:26px;padding:28px}.gallery{background:#f0ede6;border-radius:20px;min-height:570px;display:grid;place-items:center;overflow:hidden}.gallery img{width:100%;height:570px;object-fit:contain}.product-info{padding:20px 12px}.product-info .cat{margin-top:10px}.product-info h1{font:600 44px/1.05 "Playfair Display",serif;margin:10px 0 14px}.product-info .lead{color:#5e5a52;line-height:1.7}.product-price{font-size:30px;font-weight:700;margin:18px 0}.product-price del{font-size:14px;color:#999;margin-left:8px}.stock{font-size:13px;color:#3e6b45}.low{color:#a54c36}.buyrow{display:flex;gap:9px;margin:20px 0}.buyrow button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700}.buy{background:var(--ink);color:#fff}.save{background:#fff;border:1px solid var(--line)!important}.detail-title{font-size:21px;margin:30px 0 10px;border-bottom:1px solid var(--line);padding-bottom:12px}.item-details{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:12px}.item-details div{padding:13px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.item-details b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#777}.item-details span{display:block;margin-top:5px}.about-list{padding-left:20px}.about-list li{margin:11px 0;line-height:1.65;color:#35342f}.accordion{border:1px solid var(--line);background:#f7f8f8;margin:0 0 8px;border-radius:0}.accordion button{width:100%;border:0;background:transparent;padding:16px;text-align:left;font-weight:700;display:flex;justify-content:space-between}.accordion .body{display:none;padding:0 16px 16px;color:#5e5a52;line-height:1.65}.accordion.open .body{display:block}
.overlay{position:fixed;inset:0;background:#090907a8;backdrop-filter:blur(7px);z-index:70;display:grid;place-items:center;padding:18px}.modal{width:min(1050px,100%);max-height:93vh;overflow:auto;background:var(--card);border-radius:25px;padding:28px;position:relative}.close{position:absolute;right:18px;top:18px;border:0;background:#eee8dc;width:38px;height:38px;border-radius:50%}.admin h2{font:600 34px "Playfair Display",serif}.admin p{color:var(--muted);line-height:1.6}.adminbar{display:flex;gap:10px;justify-content:flex-end;margin:15px 0}.adminrow{display:grid;grid-template-columns:60px 1fr auto auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.adminrow img{width:60px;height:60px;object-fit:cover;border-radius:10px}.adminrow small{display:block;color:var(--muted);margin-top:4px}.adminrow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px}.form{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:11px;color:var(--muted)}.formgrid input,.formgrid textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.formgrid textarea{min-height:90px}.full{grid-column:1/-1}.formactions{text-align:right;margin-top:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;z-index:100;font-size:13px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.trust{grid-template-columns:repeat(2,1fr)}.product-page{grid-template-columns:1fr}.gallery,.gallery img{height:450px;min-height:450px}}
@media(max-width:650px){.nav{height:auto;flex-wrap:wrap;padding:13px 16px}.brand{font-size:24px}.search{order:3;flex-basis:100%}.hero{margin:18px 12px 0;padding:32px 25px;min-height:500px}.hero h1{font-size:45px}.trust{grid-template-columns:1fr}.section,.page{margin-top:38px;padding:0 12px}.grid{grid-template-columns:1fr 1fr;gap:10px}.cardimg{height:190px}.cardbody{padding:12px}.cardbody h3{font-size:14px}.price{font-size:19px}.product-page{padding:14px;gap:20px}.gallery,.gallery img{height:330px;min-height:330px}.product-info{padding:5px}.product-info h1{font-size:34px}.item-details{grid-template-columns:1fr}.story{margin:40px 22px;padding:30px}footer{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}

/* Prime Panache V4 — micro-interactions */
@keyframes ppPop{0%{transform:scale(.7);opacity:.3}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ppHeart{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-8deg)}70%{transform:scale(.9) rotate(6deg)}100%{transform:scale(1)}}
@keyframes ppBag{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-5px) rotate(-8deg)}70%{transform:translateY(1px) rotate(7deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes ppShine{0%{left:-120%}100%{left:130%}}
@keyframes ppCheck{0%{transform:scale(.6);opacity:0}80%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.action-pop{animation:ppPop .42s cubic-bezier(.2,.9,.3,1)}
.wish-pop{animation:ppHeart .5s cubic-bezier(.2,.9,.3,1)}
.bag-pop{animation:ppBag .5s cubic-bezier(.2,.9,.3,1)}
.action-btn{position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px #20261f20}
.action-btn:active{transform:scale(.96)}
.action-btn::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-120%;background:linear-gradient(90deg,transparent,#fff8,transparent);transform:skewX(-20deg)}
.action-btn:hover::after{animation:ppShine .7s}
.product-page .buyrow .buy{position:relative;overflow:hidden}
.product-page .buyrow .buy::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px #ffffff18}
.delivery-box{margin:18px 0 8px;padding:17px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#fffdf9,#f5efe4)}
.delivery-title{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.delivery-title .pin-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eee2cc;color:#9b7138}
.pin-form{display:flex;gap:8px;margin-top:11px}
.pin-form input{flex:1;min-width:0;border:1px solid #d9d0c2;border-radius:10px;padding:11px 12px;outline:0;letter-spacing:.05em}
.pin-form input:focus{border-color:#bd914c;box-shadow:0 0 0 3px #d7b16b20}
.pin-form button{border:0;border-radius:10px;padding:0 15px;background:var(--ink);color:#fff;font-weight:700}
.delivery-result{margin-top:11px;font-size:12px;line-height:1.55}
.delivery-result.success{color:#3d6b45}.delivery-result.error{color:#a54c36}.delivery-result.loading{color:#9b7138}
.delivery-result .delivery-date{display:block;font-size:14px;font-weight:700;margin-top:3px;color:var(--ink)}
.delivery-note{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.upload-preview{display:flex;gap:12px;align-items:center;margin-top:7px}
.upload-preview img{width:70px;height:70px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.file-input{padding:9px!important;background:#fff}
.upload-note{font-size:10px;color:var(--muted);line-height:1.45}
.admin-save{position:relative;overflow:hidden}
.admin-save.saved{animation:ppCheck .45s}
@media(max-width:650px){.pin-form button{padding:0 12px}.delivery-box{padding:14px}}


/* V5: gallery, quantity, reviews, checkout and support */
.gallery-wrap{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}.thumbs{display:flex;flex-direction:column;gap:9px}.thumb{width:76px;height:76px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;padding:0}.thumb.active{border:2px solid var(--gold)}.thumb img{width:100%;height:100%;object-fit:cover}.main-gallery{height:570px;position:relative;background:#f0ede6;border-radius:20px;overflow:hidden;display:grid;place-items:center}.main-gallery img{width:100%;height:100%;object-fit:contain}.slide-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fffdf9dd;z-index:2}.slide-arrow.left{left:12px}.slide-arrow.right{right:12px}.slide-count{position:absolute;right:12px;bottom:12px;background:#20261fcc;color:#fff;padding:6px 9px;border-radius:999px;font-size:10px}.quantity{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;width:max-content;margin-top:13px;background:#fff}.quantity button{width:38px;height:39px;border:0;background:#f6f2eb}.quantity input{width:45px;text-align:center;border:0;outline:0;background:#fff;font-weight:700}.review-section{margin-top:28px}.review-summary{display:flex;gap:25px;align-items:center;background:#f7f3eb;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px}.review-score{font:600 36px "Playfair Display",serif}.review-form{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}.review-form select,.review-form input,.review-form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin:5px 0 10px;background:#fff}.review-form textarea{min-height:85px}.review{border-bottom:1px solid var(--line);padding:14px 0}.review .stars{color:#9b712e;letter-spacing:2px}.review small{color:var(--muted)}.dispatch-note{display:flex;gap:9px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:11px;background:#f2eee5;color:#514d45;font-size:12px}.dispatch-note b{color:var(--ink)}.support-panel{max-width:1236px;margin:0 auto 55px;padding:25px 30px;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;justify-content:space-between;gap:25px;align-items:center}.support-panel h3{font:600 25px "Playfair Display",serif;margin:0 0 5px}.support-panel p{margin:0;color:var(--muted);font-size:13px}.support-links{display:flex;gap:10px;flex-wrap:wrap}.support-links a{padding:10px 14px;border:1px solid var(--line);border-radius:999px;font-size:12px}.checkout-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkout-form label{font-size:11px;color:var(--muted)}.checkout-form input,.checkout-form textarea,.checkout-form select{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff}.checkout-form textarea{min-height:90px}.checkout-full{grid-column:1/-1}.order-summary{background:#f7f3eb;border-radius:14px;padding:14px;margin:18px 0}.order-line{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.admin-settings{margin:18px 0;border:1px solid var(--line);border-radius:14px;padding:15px}.admin-settings input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:5px 0 10px}
@media(max-width:950px){.gallery-wrap{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow:auto}.main-gallery{height:450px}.thumb{min-width:68px;width:68px;height:68px}}
@media(max-width:650px){.gallery-wrap{display:flex;flex-direction:column}.main-gallery{height:330px;width:100%}.thumbs{width:100%;order:2}.thumb{width:60px;height:60px;min-width:60px}.checkout-form{grid-template-columns:1fr}.checkout-full{grid-column:auto}.support-panel{margin:0 22px 40px;display:block}.support-links{margin-top:15px}}


.promo-row{display:flex;gap:8px;margin:14px 0}.promo-row input{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px}.promo-row button{border:0;border-radius:9px;background:var(--ink);color:#fff;padding:0 16px;font-weight:700}.promo-msg{font-size:12px;margin-top:5px}.promo-ok{color:#3d6b45}.promo-bad{color:#a54c36}
.order-admin-card{border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;background:#fff}.order-admin-head{display:flex;justify-content:space-between;gap:10px}.status-pill{padding:5px 9px;border-radius:999px;background:#eee8dc;font-size:10px;font-weight:700}.order-admin-card p{font-size:12px;color:var(--muted);line-height:1.55}.order-admin-card select{padding:8px;border:1px solid var(--line);border-radius:8px}


.product-heart{position:absolute;top:14px;right:14px;z-index:4;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fffdf9e8;box-shadow:0 5px 18px rgba(0,0,0,.08);font-size:19px;display:grid;place-items:center;cursor:pointer;transition:.25s}.product-heart:hover{transform:scale(1.08)}.product-heart.active{color:#9a3150}.buy-now{background:linear-gradient(135deg,#b98a43,#8f6328)!important;color:#fff!important;border:0!important;box-shadow:0 8px 20px rgba(143,99,40,.22)}.buy-now:hover{transform:translateY(-2px);box-shadow:0 11px 24px rgba(143,99,40,.28)}.share-product{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:11px;cursor:pointer}.policy-grid{max-width:1236px;margin:0 auto 25px;padding:0 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.policy-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px}.policy-card h4{margin:0 0 7px;font:600 17px "Playfair Display",serif}.policy-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.address-card{grid-column:1/-1}.wishlist-page{min-height:55vh}.wishlist-empty{border:1px solid var(--line);border-radius:18px;padding:40px;text-align:center;background:#fff}.wishlist-empty h2{font:600 30px "Playfair Display",serif;margin:0 0 8px}.wishlist-empty p{color:var(--muted)}@media(max-width:700px){.policy-grid{grid-template-columns:1fr;padding:0 22px}.address-card{grid-column:auto}}


.upi-pay-box{margin-top:18px;border:1px solid #eadfcb;border-radius:18px;background:linear-gradient(145deg,#fffaf0,#fff);padding:18px}
.upi-brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#5b2b92}.upi-dot{width:32px;height:32px;border-radius:10px;background:#6739b7;color:#fff;display:grid;place-items:center;font-weight:900}

.upi-pay-btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(103,57,183,.3)}
.upi-note{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}
.upi-modal{text-align:center;max-width:460px}

function validateIndianPin(pin){return /^[1-9][0-9]{5}$/.test(pin)}
async function checkDelivery(pin){
  pin=(pin||'').replace(/\D/g,'').slice(0,6);
  const box=document.getElementById('deliveryResult');
  if(!box)return;
  if(!validateIndianPin(pin)){box.className='delivery-result error';box.innerHTML='Please enter a valid 6-digit Indian PIN code.';return}
  box.className='delivery-result loading';box.innerHTML='Checking PIN code…';
  try{
    // Postal location data from a public API built from India Post postal data.
    const res=await fetch('https://api.pincodeapi.in/api/v1/pincode/'+pin);
    if(!res.ok)throw new Error('PIN not found');
    const data=await res.json();
    const offices=data.data||[];
    if(!offices.length)throw new Error('PIN not found');
    const state=(data.state||offices[0]?.state||'').toUpperCase();
    const district=(data.district||offices[0]?.district||'').toUpperCase();
    const delivery=offices.filter(o=>(o.deliveryStatus||'').toLowerCase()==='delivery');
    const targetState=state;
    // Store dispatch point: Trichy, Tamil Nadu. Estimate is a planning estimate,
    // using postal-region distance rather than a carrier SLA.
    let minDays=4,maxDays=7;
    if(targetState==='TAMIL NADU'){
      const nearTN=/TRICHY|TIRUCHIRAPPALLI|THANJAVUR|PUDUKKOTTAI|KARUR|PERAMBALUR|ARIYALUR|NAMAKKAL|SALEM|TIRUPPUR|COIMBATORE|ERODE|DINDIGUL|MADURAI|SIVAGANGA|THENI|VIRUDHUNAGAR|THOOTHUKKUDI|TIRUNELVELI|TENKASI|RAMANATHAPURAM|CUDDALORE|VILLUPURAM|KALLAKURICHI|CHENGALPATTU|KANCHIPURAM|THIRUVALLUR|CHENNAI/i.test(district);
      [minDays,maxDays]=nearTN?[2,4]:[3,5];
    } else if(/KERALA|KARNATAKA|ANDHRA PRADESH|TELANGANA|PUDUCHERRY/i.test(targetState)){
      [minDays,maxDays]=[3,5];
    } else if(/GOA|MAHARASHTRA|ODISHA|CHHATTISGARH|MADHYA PRADESH|GUJARAT|WEST BENGAL/i.test(targetState)){
      [minDays,maxDays]=[4,7];
    } else if(/DELHI|HARYANA|PUNJAB|RAJASTHAN|UTTAR PRADESH|UTTARAKHAND|BIHAR|JHARKHAND|HIMACHAL|JAMMU|KASHMIR|CHANDIGARH/i.test(targetState)){
      [minDays,maxDays]=[5,8];
    } else if(/ASSAM|ARUNACHAL|MANIPUR|MEGHALAYA|MIZORAM|NAGALAND|SIKKIM|TRIPURA/i.test(targetState)){
      [minDays,maxDays]=[7,11];
    }
    const addBusinessDays=(date,n)=>{
      let d=new Date(date);
      while(n>0){d.setDate(d.getDate()+1);if(d.getDay()!==0)n--}
      return d;
    };
    const from=addBusinessDays(new Date(),minDays),to=addBusinessDays(new Date(),maxDays);
    const fmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    box.className='delivery-result success';
    box.innerHTML=`✓ Delivery available to <b>${esc(district||'your area')}</b>, ${esc(targetState)} <span class="delivery-date">Estimated delivery: ${fmt(from)} – ${fmt(to)}</span>`;
  }catch(e){
    box.className='delivery-result error';box.innerHTML='We couldn’t verify this PIN code. Please check the 6-digit number and try again.';
  }
}

function calculatePromo(code,subtotal){
 code=(code||'').trim().toUpperCase();
 const p=promoCodes.find(x=>x.code.toUpperCase()===code&&x.active&&(!x.expiry||new Date(x.expiry+'T23:59:59')>=new Date()));
 if(!p)return {valid:false,message:'Invalid or expired promo code.'};
 if(subtotal<Number(p.minOrder||0))return {valid:false,message:`Minimum order for this code is ${money(p.minOrder)}.`};
 let discount=p.type==='percent'?Math.min(subtotal*(Number(p.value)/100),Number(p.maxDiscount||Infinity)):Math.min(subtotal,Number(p.value));
 return {valid:true,promo:p,discount:Math.round(discount),message:`✓ ${p.code} applied — you save ${money(Math.round(discount))}.`};
}

 const upiUri=`upi://pay?${params}`;

 // Other mobile/desktop browsers keep the standard UPI URI.

  if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toast('Product link copied')).catch(()=>toast(url))}
  else toast(url);
}
function buyNow(id){
  const input=document.getElementById('qtyInput');
  const p=products.find(x=>x.id===id);
  const qty=Math.max(1,Math.min(p?.stock||1,Number(input?.value||1)));
  cart[id]=qty;
  persist();
  checkoutForm();
}

function openProduct(id,push=true){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p){
    toast('Product is still loading. Please try again.');
    return;
  }
  current=id;
  if(push) history.pushState({product:id},'',productUrl(id));
  document.getElementById('app').innerHTML=header()+productPage(p)+footer();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleWish(id){wish=wish.includes(id)?wish.filter(x=>x!==id):[...wish,id];persist();if(current==='home')renderHome();else if(current==='wishlist')showWishlist();else openProduct(current,false);toast(wish.includes(id)?'Added to wishlist':'Removed from wishlist')}
function add(id){cart[id]=(cart[id]||0)+1;persist();toast('Added to your bag')}
function openCart(){
  // Remove cart entries whose products no longer exist in the cloud catalogue.
  // This prevents a stale localStorage cart from crashing the bag after a Supabase sync.
  const validIds=Object.keys(cart).filter(id=>products.some(p=>p.id===id));
  const changed=validIds.length!==Object.keys(cart).length;
  if(changed){
    const cleaned={};
    validIds.forEach(id=>{cleaned[id]=Math.max(1,Number(cart[id])||1)});
    cart=cleaned;
    persist();
  }

  const ids=Object.keys(cart);
  const total=ids.reduce((s,id)=>{
    const p=products.find(x=>x.id===id);
    return s+(p ? Number(p.price||0)*Number(cart[id]||0) : 0);
  },0);

  document.getElementById('modal')?.remove();

  const d=document.createElement('div');
  d.id='modal';
  d.className='overlay';

  const itemsHtml=ids.length
    ? ids.map(id=>{
        const p=products.find(x=>x.id===id);
        return `<div class="adminrow">
          <img src="${esc(p.image)}" alt="">
          <div><b>${esc(p.name)}</b><small>${money(p.price)} · Qty ${cart[id]}</small></div>
          <button type="button" data-cart-minus="${esc(id)}">−</button>
          <button type="button" data-cart-plus="${esc(id)}">+</button>
        </div>`;
      }).join('')
    : '<p>Your bag is waiting for something beautiful.</p>';

  d.innerHTML=`<div class="modal">
    <button type="button" class="close" id="closeBag">×</button>
    <h2 style="font:600 32px 'Playfair Display',serif">Your Bag</h2>
    ${itemsHtml}
    <div style="display:flex;justify-content:space-between;font-size:21px;margin:20px 0">
      <span>Total</span><b>${money(total)}</b>
    </div>
    ${ids.length ? `<button type="button" id="bagCheckoutBtn" class="checkout" style="background:var(--ink);color:#fff;border:0;border-radius:12px;padding:14px;width:100%;cursor:pointer">Enter shipping details &amp; continue</button>` : ''}
  </div>`;

  document.body.appendChild(d);

  document.getElementById('closeBag')?.addEventListener('click',()=>d.remove());

  d.querySelectorAll('[data-cart-minus]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      changeCart(btn.dataset.cartMinus,-1);
    });
  });

  d.querySelectorAll('[data-cart-plus]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      changeCart(btn.dataset.cartPlus,1);
    });
  });

  document.getElementById('bagCheckoutBtn')?.addEventListener('click',()=>{
    checkoutForm();
  });
}
function changeCart(id,d){
  const p=products.find(x=>x.id===id);
  if(!p){delete cart[id];persist();openCart();return}
  cart[id]=(Number(cart[id])||0)+Number(d);
  if(cart[id]<=0)delete cart[id];
  persist();
  openCart();
}

async function loginAdmin(e){
  e?.preventDefault();
  const email=document.getElementById('adminEmail')?.value.trim();
  const password=document.getElementById('adminpass')?.value||'';
  const btn=document.getElementById('adminSignIn');
  const msg=document.getElementById('adminLoginMsg');
  if(!sb){if(msg)msg.textContent='Cloud authentication is unavailable. Please refresh.';return}
  if(!email||!password){if(msg)msg.textContent='Enter your admin email and password.';return}
  if(btn){btn.disabled=true;btn.textContent='Signing in…'}
  if(msg)msg.textContent='';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error||!data?.user) throw new Error(error?.message||'Sign in failed');
    const {data:adminRow,error:adminError}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();
    if(adminError) throw new Error(adminError.message);
    if(!adminRow){
      await sb.auth.signOut();
      throw new Error('This account is not authorized as a Prime Panache administrator.');
    }
    await loadAdminCloud();
    document.getElementById('modal')?.remove();
    renderAdmin();
  }catch(err){
    console.error(err);
    if(msg)msg.textContent=err.message||'Unable to sign in.';
    if(btn){btn.disabled=false;btn.textContent='Sign in securely'}
  }
}

async function loadCloudData(){
  if(!sb)return;
  try{
    const [{data:ps},{data:ims},{data:settings},{data:rs}]=await Promise.all([
      sb.from('products').select('*').eq('active',true),
      sb.from('product_images').select('*').order('sort_order',{ascending:true}),
      sb.from('store_settings').select('*').eq('id',1).maybeSingle(),
      sb.from('reviews').select('*').eq('approved',true).order('created_at',{ascending:false})
    ]);
    if(ps&&ps.length){
      products=ps.map(row=>{
        const imgs=(ims||[]).filter(x=>x.product_id===row.id).sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.image_url);
        return {id:row.id,name:row.name,category:row.category,price:Number(row.price||0),mrp:Number(row.mrp||0),rating:Number(row.rating||0),reviews:Number(row.review_count||0),stock:Number(row.stock||0),badge:row.badge||'',image:imgs[0]||row.image||'',images:imgs.length?imgs:[row.image||''],short:row.short_description||'',about:row.about_items||[],details:row.product_details||{},accordions:row.accordion_details||{}};
      });
    }
    if(settings){
      deliveryFee=Number(settings.delivery_fee??40);
      storeSettings={email:settings.support_email||STORE_DEFAULTS.email,phone:settings.support_phone||STORE_DEFAULTS.phone};
    }
    reviews={};
    (rs||[]).forEach(r=>{(reviews[r.product_id] ||= []).push({name:r.customer_name,rating:r.rating,text:r.review_text,date:r.created_at});});
    if(location.pathname==='/admin') await loadAdminCloud();
  }catch(e){console.warn('Cloud catalogue unavailable; using local catalogue.',e)}
}
async function requireAdmin(){
  if(!sb){toast('Cloud service unavailable. Please refresh and try again.');return false}
  const {data:{user},error}=await sb.auth.getUser();
  if(error||!user){toast('Please sign in as the Prime Panache admin.');admin();return false}
  const {data:adminRow,error:adminError}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
  if(adminError||!adminRow){toast('This account is not authorized as Prime Panache admin.');await sb.auth.signOut();admin();return false}
  return true;
}
async function loadAdminCloud(){
  if(!sb)return;
  const [pr,im,pc,or,st]=await Promise.all([
    sb.from('products').select('*').order('created_at',{ascending:false}),
    sb.from('product_images').select('*').order('sort_order',{ascending:true}),
    sb.from('promocodes').select('*').order('created_at',{ascending:false}),
    sb.from('orders').select('*').order('created_at',{ascending:false}),
    sb.from('store_settings').select('*').eq('id',1).maybeSingle()
  ]);
  if(pr.data && pr.data.length){products=pr.data.map(row=>{const imgs=(im.data||[]).filter(x=>x.product_id===row.id).sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.image_url);return {id:row.id,name:row.name,category:row.category,price:Number(row.price||0),mrp:Number(row.mrp||0),rating:Number(row.rating||0),reviews:Number(row.review_count||0),stock:Number(row.stock||0),badge:row.badge||'',image:imgs[0]||'',images:imgs,short:row.short_description||'',about:row.about_items||[],details:row.product_details||{},accordions:row.accordion_details||{}}});}
  promoCodes=(pc.data||[]).map(x=>({id:x.id,code:x.code,type:x.discount_type==='percentage'?'percent':'fixed',value:Number(x.discount_value||0),minOrder:Number(x.min_order_value||0),maxDiscount:Number(x.max_discount||0),expiry:x.expires_at?String(x.expires_at).slice(0,10):'',active:x.active}));
  orders=(or.data||[]).map(x=>({id:x.order_number,name:x.customer_name,email:x.customer_email,phone:x.customer_phone,address:x.shipping_address,items:x.items,subtotal:Number(x.subtotal||0),deliveryFee:Number(x.delivery_fee||0),discount:Number(x.discount||0),promo:x.promo_code||'',total:Number(x.total||0),paymentStatus:x.payment_status||'pending',status:x.order_status||'new',emailStatus:x.email_status||'pending',createdAt:x.created_at,cloudId:x.id}));
  if(st.data){deliveryFee=Number(st.data.delivery_fee??40);storeSettings={email:st.data.support_email||STORE_DEFAULTS.email,phone:st.data.support_phone||STORE_DEFAULTS.phone};}
}
async function syncSeedToCloud(){
  if(!sb||!(await requireAdmin()))return;
  for(const p of SEED){
    const row={name:p.name,category:p.category,short_description:p.short,price:p.price,mrp:p.mrp,stock:p.stock,badge:p.badge,rating:p.rating||0,review_count:p.reviews||0,about_items:p.about||[],product_details:p.details||{},accordion_details:p.accordions||{},active:true};
    const existing=await sb.from('products').select('id').eq('name',p.name).maybeSingle();
    let pid=existing.data?.id;
    if(pid) await sb.from('products').update(row).eq('id',pid); else {const r=await sb.from('products').insert(row).select('id').single();pid=r.data?.id;}
    if(pid&&p.images?.length){await sb.from('product_images').delete().eq('product_id',pid);for(let i=0;i<p.images.length;i++)await sb.from('product_images').insert({product_id:pid,image_url:p.images[i],sort_order:i});}
  }
}

// Robust interaction delegation. This keeps product, wishlist and bag actions
// working even after cloud data re-renders the storefront.
document.addEventListener('click', function(e){
  const openBtn=e.target.closest?.('[data-open-product]');
  if(openBtn){ e.preventDefault(); openProduct(openBtn.dataset.openProduct); return; }

  const addBtn=e.target.closest?.('[data-add-product]');
  if(addBtn){ e.preventDefault(); add(addBtn.dataset.addProduct); addActionAnimation('cart'); return; }

  const wishBtn=e.target.closest?.('[data-wish-id]');
  if(wishBtn){ e.preventDefault(); toggleWish(wishBtn.dataset.wishId); return; }

  const addQty=e.target.closest?.('[data-add-quantity]');
  if(addQty){ e.preventDefault(); addQuantity(addQty.dataset.addQuantity); return; }

  const buy=e.target.closest?.('[data-buy-now]');
  if(buy){ e.preventDefault(); buyNow(buy.dataset.buyNow); return; }

  const slide=e.target.closest?.('[data-slide-gallery]');
  if(slide){ e.preventDefault(); slideGallery(Number(slide.dataset.slideGallery), slide.dataset.slideProduct); return; }

  const card=e.target.closest?.('[data-product-card]');
  if(card && !e.target.closest('button,a,input,select,textarea')){
    openProduct(card.dataset.productCard);
  }
});

async async function initCloud(){
  const isAdmin=location.pathname==='/admin';
  // Always render something immediately.
  if(isAdmin) admin();
  else renderHome();

  if(sb){
    await loadCloudData();
  }

  if(isAdmin){
    const {data:{user}}=sb ? await sb.auth.getUser() : {data:{user:null}};
    if(user){
      const {data:adminRow}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
      if(adminRow){
        await loadAdminCloud();
        document.getElementById('modal')?.remove();
        renderAdmin();
      }
    }
    return;
  }

  const pid=new URLSearchParams(location.search).get('product');
  if(pid){
    if(products.some(p=>String(p.id)===String(pid))) openProduct(pid,false);
  }
}
window.addEventListener('popstate',()=>{const pid=new URLSearchParams(location.search).get('product');if(pid&&products.some(p=>p.id===pid))openProduct(pid,false);else if(location.pathname==='/admin')admin();else goHome()});
window.admin=admin;
window.loginAdmin=loginAdmin;
window.openProduct=openProduct;
window.add=add;
window.openCart=openCart;
window.toggleWish=toggleWish;
window.addQuantity=addQuantity;
window.buyNow=buyNow;
window.slideGallery=slideGallery;
window.setGallery=setGallery;
window.checkoutForm=checkoutForm;
window.goHome=goHome;
window.quantityChange=quantityChange;
window.checkDelivery=checkDelivery;
window.copyProductLink=copyProductLink;
window.submitReview=submitReview;
window.searchProducts=searchProducts;
initCloud();
